databases:
  - name: comunicador-db
    plan: free
    databaseName: comunicador
    user: comunicador

services:
  - type: web
    name: comunicador-entre-areas
    runtime: node
    plan: free
    buildCommand: npm install
    preDeployCommand: npm run db:setup
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: comunicador-db
          property: connectionString
      - key: AGENT_API_KEY
        generateValue: true
